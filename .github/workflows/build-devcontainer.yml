name: Build DevContainer

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform (must match the offline machine CPU architecture)'
        type: choice
        required: true
        default: 'linux-amd64'
        options:
          - 'linux-amd64'
          - 'linux-arm64'
      target_codec:
        description: 'Preinstalled language environments (python3.13 / golang1.26 / node24 with npm+pnpm+npx)'
        type: choice
        required: true
        default: 'python3.13'
        options:
          - 'python3.13'
          - 'python3.13 + node24(npm+pnpm+npx)'
          - 'golang1.26'
          - 'golang1.26 + node24(npm+pnpm+npx)'
          - 'python3.13 + golang1.26'
          - 'python3.13 + golang1.26 + node24(npm+pnpm+npx)'
      source_layout:
        description: 'Source layout: single_app = monolith app in app/ (requirements.txt & package.json both in app/); febe_separation = split backend (api/, requirements.txt) + frontend (web/, package.json, static build hosted by nginx)'
        type: choice
        required: true
        default: 'single_app'
        options:
          - 'single_app'
          - 'febe_separation'
      pip_packages:
        description: 'Pip packages, separated by $ (e.g. numpy$pandas$requests). Leave empty for no extra packages. Requires a python3.13 target_codec.'
        type: string
        required: false
        default: ''
      apt_packages:
        description: 'APT packages, space separated (e.g. git vim curl)'
        type: string
        required: false
        default: ''
      custom_install_cmd:
        description: 'Custom install command executed in the prod image (e.g. curl https://xxx/install.sh | bash)'
        type: string
        required: false
        default: ''
      enable_playwright:
        description: 'Preinstall Playwright (pip) + chromium browser (headful & headless share the same browser; CLI globally available, browsers at /opt/ms-playwright). Requires a python3.13 target_codec.'
        type: boolean
        required: true
        default: false
      enable_oracle_instantclient:
        description: 'Oracle Instant Client 19 mode: none = install nothing; runtime_deps_only = runtime deps (libaio1/libnsl2) + env vars only, the client itself is bind-mounted from the host at /opt/oracle/instantclient19 by docker-compose; full = install the client + runtime deps into the image (downloaded at build time from the official Oracle URL). Requires a python3.13 target_codec.'
        type: choice
        required: true
        default: 'none'
        options:
          - 'none'
          - 'runtime_deps_only'
          - 'full'
      preset_envs:
        description: 'Preset env vars injected into app/dev services, multiple separated by a single 》 (e.g. DB_HOST=10.0.0.1》DB_PORT=1521)'
        type: string
        required: false
        default: ''
      npm_packages:
        description: 'npm packages installed globally at build time, separated by $ (e.g. vite$webpack$webpack-cli$vue$react). Requires a node24 target_codec.'
        type: string
        required: false
        default: ''
      npm_packages_dir:
        description: 'Host folder holding the Npm Download artifact (its packages/ content: *.tgz + package.json). It is mounted read-only at /opt/npm-packages so `make npm-install` / `bash docker/build.sh` can install frontend dependencies offline. Relative values resolve against the docker/ folder (the compose project directory; default deps/packages = docker/deps/packages, created by docker/init-deps.sh) or absolute. Requires a node24 target_codec.'
        type: string
        required: true
        default: 'deps/packages'
      css_framework_install:
        description: 'Preinstall a CSS framework (latest version): bootstrap / tailwind, each via pack_in_artifact (offline tgz shipped in the bundle, extracted to <project root>/src/vendor/) or install_via_npm (npm global install in the image, requires a node24 target_codec). See repo docs for details.'
        type: choice
        required: true
        default: 'none'
        options:
          - 'none'
          - 'bootstrap_pack_in_artifact'
          - 'bootstrap_install_via_npm'
          - 'tailwind_pack_in_artifact'
          - 'tailwind_install_via_npm'
      enable_fe_framework:
        description: 'Frontend preset: none = install nothing; vue = auto-enable Node.js 24 (npm+pnpm+npx) and preinstall the full Vue 3 + TypeScript + Vite Plus stack (Element Plus, Pinia, Router, VueUse, Tailwind v4, Reka UI/shadcn-vue, TipTap, Playwright, etc.) in the DEV image only. Prod image stays backend-only; static dist is served by nginx. Selecting vue auto-builds the dev image when image_mode=prod-only.'
        type: choice
        required: true
        default: 'none'
        options:
          - 'none'
          - 'vue'
      nginx_mode:
        description: 'Nginx hosting: none = no nginx; nginx_binary = installed into the image via APT (started by docker-run.sh, external port reuses app_port); nginx_service = standalone nginx compose service (host 8080 -> container 80). Web static build (web/dist) is hosted by nginx when enabled'
        type: choice
        required: true
        default: 'none'
        options:
          - 'none'
          - 'nginx_binary'
          - 'nginx_service'
      enable_db:
        description: 'Extra database service: none = no database; with a DB the app service automatically depends_on it (waits for the health check). nginx is configured separately via nginx_mode'
        type: choice
        required: true
        default: 'none'
        options:
          - 'none'
          - 'postgres16'
          - 'mysql8.4'
          - 'mongo9'
      image_mode:
        description: 'prod+dev = build prod + dev images; prod-only = prod only; dev-only = single dev image used for deployment too'
        type: choice
        required: true
        default: 'prod-only'
        options:
          - 'prod+dev'
          - 'prod-only'
          - 'dev-only'
      image_prefix:
        description: 'Image name prefix (prod <prefix>:<tag>, dev <prefix>-dev:<tag>)'
        type: string
        required: true
        default: 'mydevc1'
      image_tag:
        description: 'Image tag suffix: latest (overwrites on each build) or build timestamp (UTC+8)'
        type: choice
        required: true
        default: 'latest'
        options:
          - 'latest'
          - 'timestamp'
      app_source_dir:
        description: 'Subdirectory of the project root mounted into the container as /app (default "." = whole root; the project root is passed to install.sh at install time)'
        type: string
        required: true
        default: '.'
      app_port:
        description: 'App port mapping "host:container" (e.g. 3000:3000); a single port maps the same host port. Empty = no port mapping. With nginx the app is reverse-proxied and only the container port is exposed on the app network.'
        type: string
        required: false
        default: '3000:3000'
      env_file:
        description: 'Env file(s) whose variables are injected into the app service (same as docker compose env_file), comma/space separated and relative to the project root or absolute (e.g. .env). Empty = none.'
        type: string
        required: false
        default: ''
      selinux_relabel:
        description: 'Append :z to the /app bind mount (needed on SELinux enforcing hosts)'
        type: boolean
        required: true
        default: false
      enable_sync_tool:
        description: 'Install the code-sync (push) runtime: a minimal python:3.11-slim image with paramiko, provided as a standalone compose service `push` (profile: push, restart: no, project root incl. scripts/ mounted at /project). Adds `make v-push` to run scripts/push-bundle.sh inside the container (one-off, --rm) so the host needs no Python/paramiko. `make push` still runs locally.'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  build-devcontainer:
    name: Build offline dev images
    # linux-arm64 使用 ARM 原生 Runner（ubuntu-24.04-arm：公共仓库免费，
    # 私有仓库按分钟计费），免去 QEMU 模拟（速度约为原生 1/5~1/10）；
    # amd64 走标准 x86_64 Runner。
    runs-on: ${{ inputs.platform == 'linux-arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: devcontainer-pip-${{ inputs.platform }}-py3.13-${{ inputs.pip_packages }}
          restore-keys: |
            devcontainer-pip-${{ inputs.platform }}-py3.13-

      # 无需 QEMU：runner 架构已与目标平台一致（amd64 → x86_64 Runner，
      # arm64 → ubuntu-24.04-arm），docker build 全程原生执行
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and package
        id: build
        env:
          PLATFORM: ${{ inputs.platform }}
          TARGET_CODEC: ${{ inputs.target_codec }}
          # glibc / pip 源 / Node 版本 / Go 版本 / npm 源固定，不再暴露为 workflow 输入
          GLIBC_VERSION: '2.28'
          PIP_MIRROR: 'pypi.org'
          NODE_VERSION: '24'
          GO_VERSION: '1.26'
          PIP_PACKAGES: ${{ inputs.pip_packages }}
          APT_PACKAGES: ${{ inputs.apt_packages }}
          CUSTOM_INSTALL_CMD: ${{ inputs.custom_install_cmd }}
          ENABLE_PLAYWRIGHT: ${{ inputs.enable_playwright }}
          ENABLE_ORACLE_INSTANTCLIENT: ${{ inputs.enable_oracle_instantclient }}
          PRESET_ENVS: ${{ inputs.preset_envs }}
          NPM_PACKAGES: ${{ inputs.npm_packages }}
          NPM_REGISTRY: 'Official (npmjs.org)'
          NPM_PACKAGES_DIR: ${{ inputs.npm_packages_dir }}
          CSS_FRAMEWORK_INSTALL: ${{ inputs.css_framework_install }}
          ENABLE_FE_FRAMEWORK: ${{ inputs.enable_fe_framework }}
          SOURCE_LAYOUT: ${{ inputs.source_layout }}
          NGINX_MODE: ${{ inputs.nginx_mode }}
          # 原始输入透传（供 devcontainer.json 快照记录；enable_postgres 等
          # 为解析自该原始值的派生布尔，不含原始值）
          ENABLE_DB: ${{ inputs.enable_db }}
          BUILD_DEV_IMAGE: ${{ inputs.image_mode == 'prod+dev' }}
          DEV_IMAGE_ONLY: ${{ inputs.image_mode == 'dev-only' }}
          IMAGE_PREFIX: ${{ inputs.image_prefix }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          APP_SOURCE_DIR: ${{ inputs.app_source_dir }}
          APP_PORT: ${{ inputs.app_port }}
          ENV_FILE: ${{ inputs.env_file }}
          SELINUX_RELABEL: ${{ inputs.selinux_relabel }}
          ENABLE_SYNC_TOOL: ${{ inputs.enable_sync_tool }}
          IMAGE_MODE: ${{ inputs.image_mode }}
        run: python scripts/devcontainer-builder/main.py

      - name: Verify artifacts
        env:
          TARGET_CODEC: ${{ inputs.target_codec }}
          SOURCE_LAYOUT: ${{ inputs.source_layout }}
          NGINX_MODE: ${{ inputs.nginx_mode }}
          ENABLE_SYNC_TOOL: ${{ inputs.enable_sync_tool }}
        run: |
          set -euo pipefail
          echo "--- ${{ steps.build.outputs.src_name }} (top entries) ---"
          # List to a file first: piping tar into head triggers SIGPIPE (exit 2) under pipefail
          tar tzf "${{ steps.build.outputs.src_tgz }}" > /tmp/src_tgz.list
          head -30 /tmp/src_tgz.list
          echo "... $(wc -l < /tmp/src_tgz.list) entries total"
          # src 包内必须只有 compose 模板（不带渲染后的 docker-compose.yaml），
          # 由 install.sh 复制到项目根目录为 docker-compose.yml
          grep -q 'devcontainer-src/docker-compose.yml.tpl$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 docker-compose.yml.tpl"; exit 1; }
          if grep -q 'devcontainer-src/docker-compose\.yaml$' /tmp/src_tgz.list; then
            echo "::error::src 包不应包含渲染后的 docker-compose.yaml（只保留 docker-compose.yml.tpl）"
            exit 1
          fi
          # 启动方式由镜像 ENTRYPOINT（docker-run.sh）承载：SRC Bundle 内含
          # docker-run.sh，install.sh 安装到项目根后由 compose 只读挂载覆盖
          # 镜像内副本，改根目录脚本即可调整启动方式（无需重建镜像）
          tar xzf "${{ steps.build.outputs.src_tgz }}" -O devcontainer-src/docker-compose.yml.tpl > /tmp/compose.start.tpl
          grep -q 'docker-run.sh:/usr/local/bin/docker-run.sh:ro' /tmp/compose.start.tpl \
            || { echo "::error::compose 模板缺少 docker-run.sh 挂载"; exit 1; }
          grep -q '^    command: \[\]$' /tmp/compose.start.tpl \
            || { echo "::error::compose 模板 app 服务缺少 command: []（清空 CMD，启动命令由 docker-run.sh 承载）"; exit 1; }
          tar xzf "${{ steps.build.outputs.src_tgz }}" -O devcontainer-src/Dockerfile > /tmp/Dockerfile.check
          # 源码布局接线：app 服务挂载默认值按 source_layout 决定（single_app=app/，
          # febe_separation=api/，web/ 为前端目录）；febe_separation 时 compose 必须出现 web 相关路径
          if [ "$SOURCE_LAYOUT" = "febe_separation" ]; then
            grep -q 'SRC_ROOT:-../api/' /tmp/compose.start.tpl \
              || { echo "::error::febe_separation 布局 compose 挂载默认值应为 \${SRC_ROOT:-../api/}"; exit 1; }
            grep -q 'web' /tmp/compose.start.tpl \
              || { echo "::error::febe_separation 布局 compose 模板缺少 web 目录接线"; exit 1; }
          else
            grep -q 'SRC_ROOT:-../app/' /tmp/compose.start.tpl \
              || { echo "::error::single_app 布局 compose 挂载默认值应为 \${SRC_ROOT:-../app/}"; exit 1; }
          fi
          # nginx 接线：service 模式 compose 必须有独立 nginx 服务并挂载
          # nginx/default.conf；binary 模式 Dockerfile 必须安装 nginx；
          # 两种模式 src 包都带 nginx/default.conf 配置模板
          if [ "$NGINX_MODE" != "none" ]; then
            grep -q 'devcontainer-src/nginx/default.conf$' /tmp/src_tgz.list \
              || { echo "::error::src 包缺少 nginx/default.conf（nginx_mode=$NGINX_MODE）"; exit 1; }
          fi
          if [ "$NGINX_MODE" = "nginx_service" ]; then
            grep -q '../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro' /tmp/compose.start.tpl \
              || { echo "::error::nginx_service 模式 compose 缺少 nginx/default.conf 挂载"; exit 1; }
          fi
          if [ "$NGINX_MODE" = "nginx_binary" ]; then
            grep -q 'nginx' /tmp/Dockerfile.check \
              || { echo "::error::nginx_binary 模式 Dockerfile 未安装 nginx"; exit 1; }
          fi
          # febe_separation 布局：web 目录占位（index.html 固有；package.json 预装 Node 时）
          if [ "$SOURCE_LAYOUT" = "febe_separation" ]; then
            grep -q 'devcontainer-src/index.html$' /tmp/src_tgz.list \
              || { echo "::error::febe_separation 布局 src 包缺少 web 占位 index.html"; exit 1; }
          fi
          grep -q 'ENTRYPOINT \["/usr/local/bin/docker-run.sh"\]' /tmp/Dockerfile.check \
            || { echo "::error::Dockerfile 缺少 docker-run.sh ENTRYPOINT"; exit 1; }
          grep -q 'devcontainer-src/docker-run.sh$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 docker-run.sh"; exit 1; }
          tar xzf "${{ steps.build.outputs.src_tgz }}" -O devcontainer-src/docker-run.sh > /tmp/docker-run.sh
          bash -n /tmp/docker-run.sh \
            || { echo "::error::docker-run.sh 语法错误"; exit 1; }
          grep -q 'cd /app' /tmp/docker-run.sh \
            || { echo "::error::docker-run.sh 缺少 cd /app"; exit 1; }
          # 占位入口按 target_codec 生成：python3.13 → main.py，golang1.26 → main.go
          if [ "$TARGET_CODEC" != "${TARGET_CODEC/python3.13/}" ]; then
            grep -q 'devcontainer-src/main.py$' /tmp/src_tgz.list \
              || { echo "::error::src 包缺少占位 main.py"; exit 1; }
          fi
          if [ "$TARGET_CODEC" != "${TARGET_CODEC/golang1.26/}" ]; then
            grep -q 'devcontainer-src/main.go$' /tmp/src_tgz.list \
              || { echo "::error::src 包缺少占位 main.go"; exit 1; }
          fi
          # 项目根目录操作文件（install.sh 复制到 src root）与忽略文件
          grep -q 'devcontainer-src/Makefile$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 Makefile"; exit 1; }
          grep -q 'devcontainer-src/README.md$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 README.md"; exit 1; }
          # bundle README 必须包含 AI Agent 使用约定（容器内开发测试，不依赖宿主机 Python）
          tar xzf "${{ steps.build.outputs.src_tgz }}" -O devcontainer-src/README.md > /tmp/readme.md
          grep -q 'AI Agent' /tmp/readme.md \
            || { echo "::error::src README.md 未包含 AI Agent 使用约定"; exit 1; }
          grep -q 'devcontainer-src/.dockerignore$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 .dockerignore"; exit 1; }
          grep -q 'devcontainer-src/.gitignore$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 .gitignore"; exit 1; }
          # manifest 清单（push/apply/rollback 的目标条目）随包分发
          grep -q 'devcontainer-src/scripts/manifest.txt$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 scripts/manifest.txt"; exit 1; }
          tar xzf "${{ steps.build.outputs.src_tgz }}" -O devcontainer-src/scripts/manifest.txt > /tmp/manifest.txt
          if [ "$SOURCE_LAYOUT" = "febe_separation" ]; then
            grep -q 'api/$' /tmp/manifest.txt \
              || { echo "::error::febe_separation 布局 manifest 缺少 api/ 条目"; exit 1; }
            grep -q 'web/$' /tmp/manifest.txt \
              || { echo "::error::febe_separation 布局 manifest 缺少 web/ 条目"; exit 1; }
          else
            grep -q 'app/$' /tmp/manifest.txt \
              || { echo "::error::single_app 布局 manifest 缺少 app/ 条目"; exit 1; }
          fi
          grep -q 'scripts/$' /tmp/manifest.txt \
            || { echo "::error::manifest 缺少 scripts/ 条目"; exit 1; }
          # 部署辅助脚本与环境变量模板（包内 scripts/，install.sh 安装到项目根 scripts/）
          for f in scripts/manifest.txt scripts/push-bundle.sh scripts/apply-bundle.sh scripts/rollback-bundle.sh scripts/clean-images.sh scripts/.env.example; do
            grep -q "devcontainer-src/$f$" /tmp/src_tgz.list \
              || { echo "::error::src 包缺少 $f"; exit 1; }
          done
          # 根目录 .env.example：docker-compose.yml 运行时变量模板（默认值与 compose 一致）
          grep -q 'devcontainer-src/.env.example$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少根目录 .env.example"; exit 1; }
          # clean-images.sh：语法检查（scripts/ 下，清除项目根 compose 声明的镜像）
          tar xzf "${{ steps.build.outputs.src_tgz }}" -O devcontainer-src/scripts/clean-images.sh > /tmp/clean-images.sh
          bash -n /tmp/clean-images.sh
          # clean-images.sh：docker-compose.yml 必须按 scripts/ 上一级（项目根）
          # 再进 docker/ 解析
          grep -q '\.\./docker/docker-compose\.yml' /tmp/clean-images.sh \
            || { echo "::error::clean-images.sh 未按 <项目根>/docker/docker-compose.yml 解析镜像清单"; exit 1; }
          # clean-images.sh：支持 --no-name（清除名称与 Tag 均为 <none> 的悬空镜像）
          grep -q -- '--no-name' /tmp/clean-images.sh \
            || { echo "::error::clean-images.sh 缺少 --no-name 选项"; exit 1; }
          # push-bundle.sh：manifest 驱动（读取 scripts/manifest.txt），语法检查
          tar xzf "${{ steps.build.outputs.src_tgz }}" -O devcontainer-src/scripts/push-bundle.sh > /tmp/push-bundle.py
          python3 -m py_compile /tmp/push-bundle.py \
            || { echo "::error::push-bundle.sh 语法错误"; exit 1; }
          grep -q 'scripts/manifest.txt' /tmp/push-bundle.py \
            || { echo "::error::push-bundle.sh 未读取 scripts/manifest.txt 清单"; exit 1; }
          # apply-bundle.sh：语法检查（应用 bundle；无参取最新，位置参数指定 bundle 路径）
          tar xzf "${{ steps.build.outputs.src_tgz }}" -O devcontainer-src/scripts/apply-bundle.sh > /tmp/apply-bundle.sh
          sh -n /tmp/apply-bundle.sh
          grep -q -- '-y|--yes' /tmp/apply-bundle.sh \
            || { echo "::error::apply-bundle.sh 缺少 -y/--yes 选项"; exit 1; }
          grep -q 'find_newest_bundle' /tmp/apply-bundle.sh \
            || { echo "::error::apply-bundle.sh 缺少最新 bundle 选择逻辑"; exit 1; }
          grep -q 'scripts/manifest.txt' /tmp/apply-bundle.sh \
            || { echo "::error::apply-bundle.sh 未读取 scripts/manifest.txt 清单"; exit 1; }
          grep -q 'bundles/backups' /tmp/apply-bundle.sh \
            || { echo "::error::apply-bundle.sh 备份未写入 bundles/backups/"; exit 1; }
          # rollback-bundle.sh：语法检查（回滚到最新 backup；-y 跳过确认）
          tar xzf "${{ steps.build.outputs.src_tgz }}" -O devcontainer-src/scripts/rollback-bundle.sh > /tmp/rollback-bundle.sh
          sh -n /tmp/rollback-bundle.sh
          grep -q -- '-y|--yes' /tmp/rollback-bundle.sh \
            || { echo "::error::rollback-bundle.sh 缺少 -y/--yes 选项"; exit 1; }
          grep -q 'bundles/backups' /tmp/rollback-bundle.sh \
            || { echo "::error::rollback-bundle.sh 未从 bundles/backups/ 读取备份"; exit 1; }
          # Makefile：push/apply/rollback/clean 调用 scripts/ 下的 .sh 脚本，
          # ps/exec 支持参数透传
          tar xzf "${{ steps.build.outputs.src_tgz }}" -O devcontainer-src/Makefile > /tmp/Makefile.check
          for target in push apply rollback clean ps exec; do
            grep -qE "^$target:" /tmp/Makefile.check \
              || { echo "::error::Makefile 缺少 $target 目标"; exit 1; }
          done
          grep -q 'scripts/push-bundle.sh $(ARGS)' /tmp/Makefile.check \
            || { echo "::error::Makefile 的 push 未调用 scripts/push-bundle.sh 并透传 ARGS"; exit 1; }
          grep -q 'scripts/apply-bundle.sh $(ARGS)' /tmp/Makefile.check \
            || { echo "::error::Makefile 的 apply 未调用 scripts/apply-bundle.sh 并透传 ARGS"; exit 1; }
          grep -q 'scripts/rollback-bundle.sh $(ARGS)' /tmp/Makefile.check \
            || { echo "::error::Makefile 的 rollback 未调用 scripts/rollback-bundle.sh 并透传 ARGS"; exit 1; }
          grep -q 'scripts/clean-images.sh $(ARGS)' /tmp/Makefile.check \
            || { echo "::error::Makefile 的 clean 未调用 scripts/clean-images.sh 并透传 ARGS"; exit 1; }
          grep -q 'ps $(ARGS)' /tmp/Makefile.check \
            || { echo "::error::Makefile 的 ps 未透传 ARGS"; exit 1; }
          grep -q 'exec $(SERVICE) $(ARGS)' /tmp/Makefile.check \
            || { echo "::error::Makefile 的 exec 未透传 SERVICE/ARGS"; exit 1; }
          # 代码同步工具运行环境（enable_sync_tool）：Makefile v-push + compose v-push 服务
          if [ "$ENABLE_SYNC_TOOL" = "true" ]; then
            grep -q '^v-push:' /tmp/Makefile.check \
              || { echo "::error::Makefile 缺少 v-push 目标"; exit 1; }
            grep -q -- '--profile v-push run --rm v-push' /tmp/Makefile.check \
              || { echo "::error::v-push 未通过 compose v-push 服务一次性运行"; exit 1; }
            grep -q '^  v-push:' /tmp/compose.start.tpl \
              || { echo "::error::compose 模板缺少 v-push 服务"; exit 1; }
            grep -q 'restart: "no"' /tmp/compose.start.tpl \
              || { echo "::error::v-push 服务缺少 restart: \"no\"（一次性运行）"; exit 1; }
            # v-push 镜像名固定为 devcontainer-vpush:py311（与 image_prefix/image_tag 无关）
            grep -q 'image: devcontainer-vpush:py311' /tmp/compose.start.tpl \
              || { echo "::error::compose 模板缺少固定镜像名 devcontainer-vpush:py311"; exit 1; }
            if grep -qE 'devcontainer-vpush:(latest|timestamp)' /tmp/compose.start.tpl; then
              echo "::error::v-push 镜像 tag 必须固定为 py311，不得使用 latest/timestamp"; exit 1
            fi
          fi
          # 离线补装机制（build.sh + Dockerfile.addon）
          grep -q 'devcontainer-src/Dockerfile.addon$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 Dockerfile.addon"; exit 1; }
          grep -q 'devcontainer-src/build.sh$' /tmp/src_tgz.list \
            || { echo "::error::src 包缺少 build.sh"; exit 1; }
          # bundle 清理脚本 clean.sh 与镜像清单 images.txt（与 install.sh 同级分发）
          if [ -n "${{ steps.build.outputs.clean_sh }}" ]; then
            test -s "${{ steps.build.outputs.clean_sh }}" \
              || { echo "::error::clean.sh 未生成"; exit 1; }
            bash -n "${{ steps.build.outputs.clean_sh }}" \
              || { echo "::error::clean.sh 语法错误"; exit 1; }
            grep -q 'images.txt' "${{ steps.build.outputs.clean_sh }}" \
              || { echo "::error::clean.sh 未读取 images.txt 镜像清单"; exit 1; }
            grep -q 'docker compose down' "${{ steps.build.outputs.clean_sh }}" \
              || { echo "::error::clean.sh 缺少 docker compose down 尝试"; exit 1; }
            grep -q 'docker rmi' "${{ steps.build.outputs.clean_sh }}" \
              || { echo "::error::clean.sh 缺少 docker rmi 镜像删除"; exit 1; }
            grep -q 'ancestor=' "${{ steps.build.outputs.clean_sh }}" \
              || { echo "::error::clean.sh 缺少按镜像清理容器的逻辑"; exit 1; }
            sha256sum "${{ steps.build.outputs.clean_sh }}"
          else
            echo "::error::clean.sh 未生成"
            exit 1
          fi
          if [ -n "${{ steps.build.outputs.images_txt }}" ]; then
            test -s "${{ steps.build.outputs.images_txt }}" \
              || { echo "::error::images.txt 未生成"; exit 1; }
            # images.txt 必须覆盖归档内的全部镜像（Makefile IMAGES 同源）
            tar xzf "${{ steps.build.outputs.src_tgz }}" -O devcontainer-src/Makefile > /tmp/Makefile.imgs
            imgs_make=$(grep -s '^IMAGES := ' /tmp/Makefile.imgs | sed 's/^IMAGES := //')
            while IFS= read -r img; do
              [ -n "$img" ] || continue
              case "$img" in '#'*) continue ;; esac
              grep -qxF "$img" "${{ steps.build.outputs.images_txt }}" \
                || { echo "::error::images.txt 缺少镜像: $img"; exit 1; }
            done <<< "$imgs_make"
            echo "--- images.txt ---"
            cat "${{ steps.build.outputs.images_txt }}"
          else
            echo "::error::images.txt 未生成"
            exit 1
          fi
          echo "--- checksum (与 Summary 表格中的 SHA256 对比) ---"
          sha256sum "${{ steps.build.outputs.src_tgz }}"

      # install.sh 校验体量大：拆为独立 step，避免 run 块（含 ${{ }}）
      # 超过 GitHub Actions 21000 字符表达式上限
      - name: Verify install.sh (layout & wiring)
        env:
          SOURCE_LAYOUT: ${{ inputs.source_layout }}
          NGINX_MODE: ${{ inputs.nginx_mode }}
        run: |
          set -euo pipefail
          if [ -n "${{ steps.build.outputs.install_sh }}" ]; then
            echo "--- install.sh ---"
            test -x "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 缺少可执行权限"; exit 1; }
            bash -n "${{ steps.build.outputs.install_sh }}"
            grep -q -- '--load' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 缺少 --load 选项"; exit 1; }
            grep -q -- '--load-only' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 缺少 --load-only 选项"; exit 1; }
            grep -q -- '--no-load' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 缺少 --no-load 选项"; exit 1; }
            grep -q -- '--load-target' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 缺少 --load-target 选项"; exit 1; }
            grep -q '_load_subset' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 缺少按条件筛选导入（--load-target / 跳过 v-push 镜像）的逻辑"; exit 1; }
            grep -q 'manifest.json' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 筛选导入未读取 manifest.json"; exit 1; }
            grep -q 'dev|prod|app|all' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 的 --load-target 不支持 dev|prod|app|all"; exit 1; }
            grep -q 'load_images_all' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 缺少 all（整包导入）路径"; exit 1; }
            grep -q -- '-d|--default' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 缺少 -d/--default 选项"; exit 1; }
            grep -q 'INSTALL_PATH="../"' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 的 -d/--default 未使用默认项目根 ../"; exit 1; }
            # 应用源码目录按 source_layout 安装（single_app=app；febe_separation=api + web）
            if [ "$SOURCE_LAYOUT" = "febe_separation" ]; then
              grep -q 'APP_DIR_SRC="$INSTALL_PATH/api"' "${{ steps.build.outputs.install_sh }}" \
                || { echo "::error::install.sh 未把后端源码放入 <项目根>/api"; exit 1; }
              grep -q 'WEB_DIR_SRC="$INSTALL_PATH/web"' "${{ steps.build.outputs.install_sh }}" \
                || { echo "::error::install.sh 未把前端源码放入 <项目根>/web"; exit 1; }
              # 渲染后占位符已替换，用分支特有语句校验布局分支
              grep -q 'mkdir -p "$WEB_DIR_SRC"' "${{ steps.build.outputs.install_sh }}" \
                || { echo "::error::install.sh 缺少 febe_separation 布局分支（web/ 目录）"; exit 1; }
              grep -q 'APP_DIR_SRC/package.json' "${{ steps.build.outputs.install_sh }}" \
                || { echo "::error::install.sh 缺少 single_app 布局分支（package.json 放入 app/）"; exit 1; }
            else
              grep -q 'APP_DIR_SRC="$INSTALL_PATH/app"' "${{ steps.build.outputs.install_sh }}" \
                || { echo "::error::install.sh 未把应用源码放入 <项目根>/app"; exit 1; }
            fi
            # 部署辅助脚本安装到项目根 scripts/；docker/.env.example 为
            # docker-compose.yml 运行时变量模板（compose 项目目录 = docker/）
            for f in scripts/manifest.txt scripts/push-bundle.sh scripts/apply-bundle.sh scripts/rollback-bundle.sh scripts/clean-images.sh scripts/.env.example; do
              grep -q "$f" "${{ steps.build.outputs.install_sh }}" \
                || { echo "::error::install.sh 未安装 $f 到项目根 scripts/"; exit 1; }
            done
            grep -q 'DOCKER_DIR/.env.example' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 未安装 docker/.env.example"; exit 1; }
            # docker/ 目录布局：compose 运行文件、Dockerfile/addon、build.sh、
            # docker-run.sh、init-deps.sh 都安装到 <项目根>/docker/（Makefile 仍在根）
            grep -q 'COMPOSE_FILE="$INSTALL_PATH/docker/docker-compose.yml"' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 未把 docker-compose.yml 安装到 <项目根>/docker/"; exit 1; }
            grep -q 'COPY_DOCKER_FILES=("Dockerfile:Dockerfile" "Dockerfile.addon:Dockerfile.addon" "build.sh:build.sh" "docker-run.sh:docker-run.sh" "init-deps.sh:init-deps.sh")' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 未把 Dockerfile/addon/build.sh/docker-run.sh/init-deps.sh 安装到 <项目根>/docker/"; exit 1; }
            # requirements.txt 安装到应用源码目录（single_app=app/，febe_separation=api/）
            LAYOUT_DIR=$([ "$SOURCE_LAYOUT" = "febe_separation" ] && echo api || echo app)
            grep -q "COPY_APP_FILES=(\"$LAYOUT_DIR/requirements.txt:requirements.txt\")" "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 未把 requirements.txt 安装到应用源码目录 ($LAYOUT_DIR/)"; exit 1; }
            grep -q 'INSTALL_PATH/AGENTS.md' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 未安装项目根 AGENTS.md（AI Agent 使用约定）"; exit 1; }
            # AGENTS.md 必须包含完全离线约束与 devcontainer.json 重建指引
            tar xzf "${{ steps.build.outputs.src_tgz }}" -O devcontainer-src/AGENTS.md > /tmp/AGENTS.md
            grep -q '完全离线' /tmp/AGENTS.md \
              || { echo "::error::AGENTS.md 未包含完全离线约束"; exit 1; }
            grep -q 'devcontainer.json' /tmp/AGENTS.md \
              || { echo "::error::AGENTS.md 未包含 devcontainer.json 重建指引"; exit 1; }
            grep -q 'docs/DEVCONTAINER.md' /tmp/AGENTS.md \
              || { echo "::error::AGENTS.md 未引用 docs/DEVCONTAINER.md"; exit 1; }
            # README.md 安装为 docs/DEVCONTAINER.md（根目录不放 README.md）
            grep -q 'DEVCONTAINER.md' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 未把 README.md 安装为 docs/DEVCONTAINER.md"; exit 1; }
            if grep -q 'docs/devcontainer' "${{ steps.build.outputs.install_sh }}"; then
              echo "::error::install.sh 仍引用 docs/devcontainer（原始副本/重置机制已移除）"
              exit 1
            fi
            # 根目录 Dockerfile（联网重建版）与 Dockerfile.addon（离线补装）并存安装
            grep -q 'Dockerfile:Dockerfile' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 未安装联网重建版 Dockerfile"; exit 1; }
            grep -q 'Dockerfile.addon:Dockerfile.addon' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 未安装 Dockerfile.addon"; exit 1; }
            grep -q 'requirements.txt:requirements.txt' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 未安装 requirements.txt（联网重建版 COPY 依赖）"; exit 1; }
            # docker-run.sh 安装到项目根（compose 只读挂载覆盖镜像内 ENTRYPOINT 脚本）
            grep -q 'docker-run.sh:docker-run.sh' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 未把 docker-run.sh 安装到项目根目录"; exit 1; }
            # nginx 配置模板：nginx_mode 启用时安装到 <项目根>/nginx/default.conf
            if [ "$NGINX_MODE" != "none" ]; then
              grep -q 'nginx/default.conf' "${{ steps.build.outputs.install_sh }}" \
                || { echo "::error::install.sh 未安装 nginx/default.conf 配置模板"; exit 1; }
            fi
            # docs/.gitkeep 占位文件
            grep -q 'docs/.gitkeep' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 未创建 docs/.gitkeep"; exit 1; }
            # deps/ 不再默认安装：install.sh 必须安装 docker/init-deps.sh
            # （按需生成 docker/deps/ 离线依赖目录），且不得默认创建 deps/
            grep -q 'init-deps.sh:init-deps.sh' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 未安装 docker/init-deps.sh"; exit 1; }
            if grep -q 'INSTALL_PATH/deps' "${{ steps.build.outputs.install_sh }}"; then
              echo "::error::install.sh 不应再默认创建 deps/（交由 docker/init-deps.sh 按需生成）"
              exit 1
            fi
            tar xzf "${{ steps.build.outputs.src_tgz }}" -O devcontainer-src/init-deps.sh > /tmp/init-deps.sh
            bash -n /tmp/init-deps.sh \
              || { echo "::error::init-deps.sh 语法错误"; exit 1; }
            grep -q 'deps/wheels' /tmp/init-deps.sh \
              || { echo "::error::init-deps.sh 未创建 deps/wheels（离线安装头）"; exit 1; }
            grep -q 'requirements.gitkeep.txt' /tmp/init-deps.sh \
              || { echo "::error::init-deps.sh 未生成 requirements.gitkeep.txt 离线安装头"; exit 1; }
            grep -q 'packages.gitkeep.json' /tmp/init-deps.sh \
              || { echo "::error::init-deps.sh 未生成 packages.gitkeep.json 占位文件"; exit 1; }
            # devcontainer.json 快照与 README.md 一样安装到项目根目录
            grep -q 'INSTALL_PATH/devcontainer.json' "${{ steps.build.outputs.install_sh }}" \
              || { echo "::error::install.sh 未把 devcontainer.json 安装到项目根目录"; exit 1; }
            sha256sum "${{ steps.build.outputs.install_sh }}"
          else
            echo "::error::install.sh 未生成"
            exit 1
          fi

      # GitHub Actions 对含 ${{ }} 表达式的 run 块有 21000 字符上限，
      # Verify 按体量拆分为多个 step 避免超限
      - name: Verify readme, snapshot and addon dry-run
        run: |
          set -euo pipefail
          echo "--- readme.html (bundle 安装说明) ---"
          if [ -n "${{ steps.build.outputs.readme_html }}" ] && [ -s "${{ steps.build.outputs.readme_html }}" ]; then
            grep -q 'install.sh' "${{ steps.build.outputs.readme_html }}" \
              || { echo "::error::readme.html 未包含 install.sh 使用说明"; exit 1; }
            grep -q 'downloads' "${{ steps.build.outputs.readme_html }}" \
              || { echo "::error::readme.html 未包含 downloads/ 放置说明"; exit 1; }
            grep -q -- '--load' "${{ steps.build.outputs.readme_html }}" \
              || { echo "::error::readme.html 未包含 --load 用法说明"; exit 1; }
            grep -q 'AI Agent' "${{ steps.build.outputs.readme_html }}" \
              || { echo "::error::readme.html 未包含 AI Agent 使用约定"; exit 1; }
            head -1 "${{ steps.build.outputs.readme_html }}" | grep -q '<!DOCTYPE html>' \
              || { echo "::error::readme.html 不是 HTML 文档"; exit 1; }
            sha256sum "${{ steps.build.outputs.readme_html }}"
          else
            echo "::error::readme.html 未生成"
            exit 1
          fi
          echo "--- devcontainer.json (workflow 输入参数快照，纯 JSON) ---"
          test -s "${{ steps.build.outputs.devcontainer_json }}" \
            || { echo "::error::devcontainer.json 未生成"; exit 1; }
          case "${{ steps.build.outputs.devcontainer_json }}" in
            *.json) ;;
            *) echo "::error::workflow 参数快照必须输出为 .json 文件"; exit 1 ;;
          esac
          python - "${{ steps.build.outputs.devcontainer_json }}" <<'PY'
          import json, os, sys
          from pathlib import Path

          # workflow inputs 默认值（与 build-devcontainer.yml 的 inputs 保持同步）
          DEFAULTS = {
              "platform": ("linux-amd64", "choice"),
              "target_codec": ("python3.13", "choice"),
              "source_layout": ("single_app", "choice"),
              "pip_packages": ("", "string"),
              "apt_packages": ("", "string"),
              "custom_install_cmd": ("", "string"),
              "enable_playwright": ("false", "boolean"),
              "enable_oracle_instantclient": ("none", "choice"),
              "preset_envs": ("", "string"),
              "npm_packages": ("", "string"),
              "npm_packages_dir": ("deps/packages", "string"),
              "css_framework_install": ("none", "choice"),
              "enable_fe_framework": ("none", "choice"),
              "nginx_mode": ("none", "choice"),
              "enable_db": ("none", "choice"),
              "image_mode": ("prod-only", "choice"),
              "image_prefix": ("mydevc1", "string"),
              "image_tag": ("latest", "choice"),
              "app_source_dir": (".", "string"),
              "app_port": ("3000:3000", "string"),
              "env_file": ("", "string"),
              "selinux_relabel": ("false", "boolean"),
              "enable_sync_tool": ("false", "boolean"),
          }
          text = Path(sys.argv[1]).read_text(encoding="utf-8")
          # 纯 JSON：JSONC 注释会导致 json.loads 解析失败
          data = json.loads(text)
          assert list(data) == ["meta", "minimal", "normal", "full"], list(data)
          full = data["full"]
          assert list(full) == list(DEFAULTS), list(full)
          for name, (_default, kind) in DEFAULTS.items():
              value = full[name]
              if kind == "boolean":
                  assert isinstance(value, bool), (name, value)
              else:
                  assert isinstance(value, str), (name, value)
          # normal/minimal：不允许留空字符串与 false；键集合逐层收窄
          for section in ("normal", "minimal"):
              for name, value in data[section].items():
                  assert value not in ("", False), (section, name, value)
          assert set(data["minimal"]) <= set(data["normal"]) <= set(full)
          # minimal：不允许出现取默认值的参数
          for name, value in data["minimal"].items():
              default, kind = DEFAULTS[name]
              default_value = (default.lower() == "true") if kind == "boolean" else default
              assert value != default_value, (name, value, default)
          # meta：构建来源信息（当前仅 repo）；CI 中必须等于本仓库 URL
          meta = data["meta"]
          assert list(meta) == ["repo"], list(meta)
          expected_repo = ""
          if os.environ.get("GITHUB_REPOSITORY"):
              expected_repo = (os.environ.get("GITHUB_SERVER_URL")
                               or "https://github.com") \
                  + "/" + os.environ["GITHUB_REPOSITORY"]
          assert meta["repo"] == expected_repo, (meta["repo"], expected_repo)
          print("devcontainer.json OK "
                f"(minimal={len(data['minimal'])}, normal={len(data['normal'])}, "
                f"full={len(full)}, meta.repo={meta['repo'] or '(空)'})")
          PY
          sha256sum "${{ steps.build.outputs.devcontainer_json }}"
          echo "--- build.sh (from src tgz) ---"
          tar xzf "${{ steps.build.outputs.src_tgz }}" -O devcontainer-src/build.sh > /tmp/build.sh
          bash -n /tmp/build.sh
          # tar 需保留可执行位（artifact zip 解压可能丢失，文档引导 bash 调用）
          tar tvzf "${{ steps.build.outputs.src_tgz }}" devcontainer-src/build.sh \
            | grep -q '^-[rwx-]*x' \
            || { echo "::error::src 包内 build.sh 无可执行权限"; exit 1; }
          # 回归测试（离线补装）：模拟 install.sh 的根目录布局
          # （Dockerfile.addon 与 build.sh 安装到项目根、安装根目录 .dockerignore、
          #  deps/wheels/ 放 dummy wheel、deps/packages/ 放 fake tgz），用
          # mock docker 干跑 build.sh，断言：addon 构建调用的上下文只含 wheels
          # 且无任何 dockerignore；enable_node 时一键加载前端依赖会发起
          # docker compose run——确保项目根 .dockerignore 排除 deps/ 不会导致
          # 离线补装（COPY wheels/）失败
          echo "--- build.sh addon dry-run (mock docker) ---"
          TESTROOT=$(mktemp -d /tmp/addon-dryrun.XXXXXX)
          PKGROOT=$(mktemp -d /tmp/addon-pkg.XXXXXX)
          mkdir -p "$TESTROOT/root" "$TESTROOT/bin" \
            "$TESTROOT/root/docker/deps/wheels" "$TESTROOT/root/docker/deps/packages"
          tar xzf "${{ steps.build.outputs.src_tgz }}" -C "$PKGROOT" --strip-components=1
          # 模拟 install.sh 的 docker/ 布局：Dockerfile.addon 与 build.sh 安装到
          # <项目根>/docker/，deps/ 位于 docker/deps/
          cp "$PKGROOT/Dockerfile.addon" "$TESTROOT/root/docker/Dockerfile.addon"
          cp "$PKGROOT/build.sh" "$TESTROOT/root/docker/build.sh"
          cp "$PKGROOT/.dockerignore" "$TESTROOT/root/.dockerignore"
          touch "$TESTROOT/root/docker/deps/wheels/dummy-1.0-py3-none-any.whl"
          touch "$TESTROOT/root/docker/deps/packages/vue-1.0.0.tgz"
          cat > "$TESTROOT/bin/docker" <<'MOCK'
          #!/usr/bin/env bash
          # mock docker：记录调用参数，并当场校验 build.sh 传入的构建上下文
          ctx="${*: -1}"
          echo "docker $*" >> "${MOCK_LOG:?}"
          if [ "$1" = "compose" ]; then
              # build.sh 一键加载前端依赖走 docker compose run（此处仅记录）
              exit 0
          fi
          [ "$1" = "build" ] || exit 0
          if [ -e "$ctx/.dockerignore" ] || [ -e "$ctx/Dockerfile.dockerignore" ]; then
              echo "::error::补装构建上下文不应包含 dockerignore: $ctx" >&2
              exit 1
          fi
          ls "$ctx"/wheels/*.whl >/dev/null 2>&1 \
              || { echo "::error::补装构建上下文缺少 wheels/*.whl: $ctx" >&2; exit 1; }
          exit 0
          MOCK
          chmod +x "$TESTROOT/bin/docker"
          # build.sh 按脚本自身位置解析路径，在项目根执行 bash docker/build.sh
          (
            cd "$TESTROOT/root"
            MOCK_LOG="$TESTROOT/docker.log" PATH="$TESTROOT/bin:$PATH" \
              bash docker/build.sh dryrun-addon > /dev/null
          )
          grep -q '^docker build ' "$TESTROOT/docker.log" \
            || { echo "::error::build.sh 未发起任何 docker build 调用"; exit 1; }
          grep -Fq -- "-f $TESTROOT/root/docker/Dockerfile.addon " "$TESTROOT/docker.log" \
            || { echo "::error::build.sh 未使用 docker/Dockerfile.addon（离线补装版）"; exit 1; }
          grep -q 'COPY wheels/ /tmp/addon-wheels/' "$TESTROOT/root/docker/Dockerfile.addon" \
            || { echo "::error::Dockerfile.addon 不是离线补装版（缺少 COPY wheels）"; exit 1; }
          rm -rf "$TESTROOT" "$PKGROOT"
          echo "addon dry-run OK: 构建上下文只含 wheels，未受根目录 .dockerignore 影响"
          echo "--- ${{ steps.build.outputs.images_name }} (docker load 用镜像归档) ---"
          # 镜像归档是 gzip 压缩的镜像归档：根目录必须能直接看到 manifest.json（或 OCI index.json）
          tar tzf "${{ steps.build.outputs.images_tgz }}" > /tmp/images.list
          head -20 /tmp/images.list
          if ! grep -qE '^(\./)?(manifest\.json|index\.json)$' /tmp/images.list; then
            echo "::error::镜像归档顶层缺少 manifest.json / index.json，docker load 会失败"
            exit 1
          fi
          sha256sum "${{ steps.build.outputs.images_tgz }}"

      # Oracle / 前端（Node/pnpm）/ 前端框架 参数联动校验：确保生成物真的按参数接线
      - name: Verify oracle / npm / frontend framework wiring
        env:
          ORACLE_MODE: ${{ inputs.enable_oracle_instantclient }}
          NODE_ENABLED: ${{ contains(inputs.target_codec, 'node24') || inputs.enable_fe_framework == 'vue' }}
          TARGET_CODEC: ${{ inputs.target_codec }}
          CSS_FRAMEWORK_INSTALL: ${{ inputs.css_framework_install }}
          FE_FRAMEWORK: ${{ inputs.enable_fe_framework }}
          FRAMEWORK_TGZ: ${{ steps.build.outputs.framework_tgz }}
          DEV_ENABLED: ${{ inputs.image_mode == 'prod+dev' || inputs.image_mode == 'dev-only' || inputs.enable_fe_framework == 'vue' }}
          DEV_IMAGE_ONLY: ${{ inputs.image_mode == 'dev-only' }}
          SRC_TGZ: ${{ steps.build.outputs.src_tgz }}
          INSTALL_SH: ${{ steps.build.outputs.install_sh }}
          README_HTML: ${{ steps.build.outputs.readme_html }}
        run: |
          set -euo pipefail
          # css_framework_install → 框架名 / 安装方式（none 时均为 none）
          if [ "$CSS_FRAMEWORK_INSTALL" = "none" ]; then
            FRAMEWORK=none
            FRAMEWORK_INSTALL=none
          else
            FRAMEWORK="${CSS_FRAMEWORK_INSTALL%%_*}"
            FRAMEWORK_INSTALL="${CSS_FRAMEWORK_INSTALL#*_}"
          fi
          tar xzf "$SRC_TGZ" -O devcontainer-src/docker-compose.yml.tpl > /tmp/compose.tpl
          tar xzf "$SRC_TGZ" -O devcontainer-src/Dockerfile > /tmp/Dockerfile
          tar xzf "$SRC_TGZ" -O devcontainer-src/Makefile > /tmp/Makefile

          if [ "$ORACLE_MODE" = "runtime_deps_only" ]; then
            grep -q 'ORACLE_CLIENT_DIR:-/opt/oracle/instantclient19' /tmp/compose.tpl \
              || { echo "::error::compose 模板缺少 Oracle 客户端挂载"; exit 1; }
            grep -q 'ORACLE_HOME' /tmp/compose.tpl \
              || { echo "::error::compose 模板缺少 Oracle 环境变量"; exit 1; }
            grep -q 'ORACLE_HOME=/opt/oracle/instantclient19' /tmp/Dockerfile \
              || { echo "::error::Dockerfile 缺少 Oracle 环境变量"; exit 1; }
            if grep -q 'instantclient-basic' /tmp/Dockerfile; then
              echo "::error::runtime_deps_only 模式不应把 Oracle 客户端下载进镜像"
              exit 1
            fi
            grep -q 'ORACLE_CLIENT_DIR' "$INSTALL_SH" \
              || { echo "::error::install.sh 缺少 Oracle 配置提示"; exit 1; }
            grep -q 'ORACLE_CLIENT_DIR' "$README_HTML" \
              || { echo "::error::readme.html 缺少 Oracle 配置提示"; exit 1; }
            echo "oracle wiring OK (runtime_deps_only)"
          elif [ "$ORACLE_MODE" = "full" ]; then
            grep -q 'instantclient-basic' /tmp/Dockerfile \
              || { echo "::error::full 模式 Dockerfile 缺少 Oracle 客户端下载"; exit 1; }
            grep -q 'ORACLE_HOME=/opt/oracle/instantclient19' /tmp/Dockerfile \
              || { echo "::error::Dockerfile 缺少 Oracle 环境变量"; exit 1; }
            if grep -q 'ORACLE_CLIENT_DIR' /tmp/compose.tpl; then
              echo "::error::full 模式客户端已打进镜像，compose 不应再挂载"
              exit 1
            fi
            grep -q 'ORACLE_HOME' "$INSTALL_SH" \
              || { echo "::error::install.sh 缺少 Oracle 安装提示"; exit 1; }
            grep -q 'Oracle Instant Client' "$README_HTML" \
              || { echo "::error::readme.html 缺少 Oracle 安装提示"; exit 1; }
            echo "oracle wiring OK (full)"
          fi

          if [ "$NODE_ENABLED" = "true" ]; then
            grep -q 'COPY --from=node' /tmp/Dockerfile \
              || { echo "::error::Dockerfile 缺少 Node.js 安装层"; exit 1; }
            grep -q 'NPM_PACKAGES_DIR:-' /tmp/compose.tpl \
              || { echo "::error::compose 模板缺少 npm 离线包挂载"; exit 1; }
            grep -q '/opt/npm-packages' /tmp/compose.tpl \
              || { echo "::error::compose 模板缺少 /opt/npm-packages 挂载点"; exit 1; }
            grep -q 'NPM_PACKAGES_DIR' "$INSTALL_SH" \
              || { echo "::error::install.sh 缺少 npm 离线包提示"; exit 1; }
            grep -q '/opt/npm-packages' "$README_HTML" \
              || { echo "::error::readme.html 缺少 npm 离线包提示"; exit 1; }
            if [ "$DEV_ENABLED" = "true" ]; then
              grep -q 'npm-install' /tmp/Makefile \
                || { echo "::error::Makefile 缺少 npm-install 目标"; exit 1; }
            fi
            # build.sh：支持 Npm Download Action 产物放入 deps/packages 后一键离线加载
            tar xzf "$SRC_TGZ" -O devcontainer-src/build.sh > /tmp/build.sh
            bash -n /tmp/build.sh
            grep -q 'deps/packages' /tmp/build.sh \
              || { echo "::error::build.sh 未读取 deps/packages（Npm Download 产物目录）"; exit 1; }
            grep -q 'npm install --offline' /tmp/build.sh \
              || { echo "::error::build.sh 缺少一键加载前端依赖（npm install --offline）"; exit 1; }
            echo "npm wiring OK"
          fi

          if [ "$FRAMEWORK" != "none" ] && [ "$FRAMEWORK_INSTALL" = "pack_in_artifact" ]; then
            test -s "$FRAMEWORK_TGZ" \
              || { echo "::error::pack_in_artifact 模式未生成前端框架 tgz"; exit 1; }
            base=$(basename "$FRAMEWORK_TGZ")
            # 先落盘再 grep：tar tzf | grep -q 在 pipefail 下，grep 命中即退出
            # 并关闭管道读端，tar 写剩余目录项触发 SIGPIPE（tar: stdout: write
            # error），会把布局校验误判为失败
            tar tzf "$FRAMEWORK_TGZ" > /tmp/framework_tgz.list
            if [ "$FRAMEWORK" = "bootstrap" ]; then
              echo "$base" | grep -qE '^bootstrap-[A-Za-z0-9._+~-]+\.tgz$' \
                || { echo "::error::bootstrap 产物文件名应为 bootstrap-<version>.tgz: $base"; exit 1; }
              grep -q '^package/dist/css/bootstrap.min.css' /tmp/framework_tgz.list \
                || { echo "::error::bootstrap tgz 不是 npm 包布局（缺少 package/dist/css/bootstrap.min.css）"; exit 1; }
              FW_LABEL=bootstrap
            elif [ "$FRAMEWORK" = "tailwind" ]; then
              echo "$base" | grep -qE '^tailwindcss-browser-[A-Za-z0-9._+~-]+\.tgz$' \
                || { echo "::error::tailwind 产物文件名应为 tailwindcss-browser-<version>.tgz: $base"; exit 1; }
              grep -q '^package/dist/index.global.js' /tmp/framework_tgz.list \
                || { echo "::error::tailwind tgz 不是 @tailwindcss/browser 布局（缺少 package/dist/index.global.js）"; exit 1; }
              FW_LABEL=tailwindcss-browser
            else
              echo "::error::不支持的 css_framework_install: $CSS_FRAMEWORK_INSTALL"; exit 1
            fi
            grep -q "vendor/$FW_LABEL-" "$INSTALL_SH" \
              || { echo "::error::install.sh 缺少 vendor/$FW_LABEL 安装逻辑"; exit 1; }
            grep -q "$FW_LABEL-" "$README_HTML" \
              || { echo "::error::readme.html 缺少前端框架安装说明"; exit 1; }
            echo "frontend framework wiring OK (pack_in_artifact: $base)"
          elif [ "$FRAMEWORK" = "bootstrap" ] && [ "$FRAMEWORK_INSTALL" = "install_via_npm" ]; then
            grep -q 'npm install -g' /tmp/Dockerfile \
              || { echo "::error::install_via_npm 模式 Dockerfile 缺少 npm 全局安装层"; exit 1; }
            grep -q 'bootstrap@' /tmp/Dockerfile \
              || { echo "::error::install_via_npm 模式 Dockerfile 未安装 bootstrap"; exit 1; }
            grep -q 'COPY --from=node' /tmp/Dockerfile \
              || { echo "::error::install_via_npm 模式应自动启用 Node.js 层"; exit 1; }
            grep -q 'bootstrap' "$INSTALL_SH" \
              || { echo "::error::install.sh 缺少 bootstrap 提示"; exit 1; }
            echo "frontend framework wiring OK (bootstrap install_via_npm)"
          elif [ "$FRAMEWORK" = "tailwind" ] && [ "$FRAMEWORK_INSTALL" = "install_via_npm" ]; then
            grep -q 'npm install -g' /tmp/Dockerfile \
              || { echo "::error::install_via_npm 模式 Dockerfile 缺少 npm 全局安装层"; exit 1; }
            grep -q 'tailwindcss@' /tmp/Dockerfile \
              || { echo "::error::install_via_npm 模式 Dockerfile 未安装 tailwindcss"; exit 1; }
            grep -q '@tailwindcss/cli@' /tmp/Dockerfile \
              || { echo "::error::install_via_npm 模式 Dockerfile 未安装 @tailwindcss/cli"; exit 1; }
            grep -q 'COPY --from=node' /tmp/Dockerfile \
              || { echo "::error::install_via_npm 模式应自动启用 Node.js 层"; exit 1; }
            grep -q 'tailwindcss' "$INSTALL_SH" \
              || { echo "::error::install.sh 缺少 tailwindcss 提示"; exit 1; }
            echo "frontend framework wiring OK (tailwind install_via_npm)"
          else
            if grep -qE 'bootstrap@|tailwindcss@|@tailwindcss/cli@' /tmp/Dockerfile; then
              echo "::error::css_framework_install=none 时 Dockerfile 不应安装前端框架"
              exit 1
            fi
            if [ -n "$FRAMEWORK_TGZ" ]; then
              echo "::error::css_framework_install=none 时不应生成前端框架 tgz"
              exit 1
            fi
            echo "frontend framework wiring OK (none)"
          fi

          # 前端技术栈（enable_fe_framework）：Vue 只进 dev 镜像，prod 保持后端依赖
          if [ "$FE_FRAMEWORK" = "vue" ]; then
            grep -q 'vite-plus' /tmp/Dockerfile \
              || { echo "::error::vue 模式 Dockerfile 缺少 Vite+（vite-plus）"; exit 1; }
            grep -q 'COPY vue-template/ /opt/vue-template/' /tmp/Dockerfile \
              || { echo "::error::vue 模式 Dockerfile 缺少 vue-template 复制层"; exit 1; }
            grep -q 'playwright install --with-deps chromium' /tmp/Dockerfile \
              || { echo "::error::vue 模式 Dockerfile 缺少 Playwright chromium"; exit 1; }
            tar tzf "$SRC_TGZ" > /tmp/src_vue.list
            for f in vue-template/package.json vue-template/vite.config.ts \
                     vue-template/.vscode/extensions.json vue-template/.vscode/settings.json; do
              grep -q "^devcontainer-src/$f$" /tmp/src_vue.list \
                || { echo "::error::src 包缺少 $f"; exit 1; }
            done
            tar xzf "$SRC_TGZ" -O devcontainer-src/vue-template/.vscode/extensions.json > /tmp/vscode_ext.json
            grep -q 'oxc.oxc-vscode' /tmp/vscode_ext.json \
              || { echo "::error::.vscode/extensions.json 未推荐 oxc.oxc-vscode"; exit 1; }
            tar xzf "$SRC_TGZ" -O devcontainer-src/vue-template/.vscode/settings.json > /tmp/vscode_settings.json
            grep -q 'oxc.oxc-vscode' /tmp/vscode_settings.json \
              || { echo "::error::.vscode/settings.json 未把默认 formatter 设为 Oxc"; exit 1; }
            for tgt in vue-init vue-dev vue-check vue-build vue-test vue-e2e; do
              grep -qE "^$tgt:" /tmp/Makefile \
                || { echo "::error::Makefile 缺少 $tgt 目标"; exit 1; }
            done
            grep -q 'make vue-init' "$INSTALL_SH" \
              || { echo "::error::install.sh 缺少 Vue 初始化提示"; exit 1; }
            # prod 阶段不得包含任何前端依赖（dev-only 镜像没有 prod 阶段）
            if [ "$DEV_IMAGE_ONLY" != "true" ]; then
              awk '/^FROM prod AS dev$/{exit} {print}' /tmp/Dockerfile > /tmp/Dockerfile.prodstage
              if grep -q 'vue-template' /tmp/Dockerfile.prodstage; then
                echo "::error::prod 镜像阶段不应包含 Vue 前端依赖"
                exit 1
              fi
            fi
            echo "vue frontend wiring OK"
          else
            if grep -q 'vue-template' /tmp/Dockerfile; then
              echo "::error::enable_fe_framework=none 时 Dockerfile 不应包含 Vue 技术栈"
              exit 1
            fi
            if grep -q '^vue-init:' /tmp/Makefile; then
              echo "::error::enable_fe_framework=none 时 Makefile 不应包含 vue 目标"
              exit 1
            fi
            tar tzf "$SRC_TGZ" > /tmp/src_vue.list
            if grep -q 'devcontainer-src/vue-template/' /tmp/src_vue.list; then
              echo "::error::enable_fe_framework=none 时 src 包不应包含 vue-template"
              exit 1
            fi
            echo "vue frontend wiring OK (none)"
          fi

          # install.sh / readme.html 的 --load-target 文档
          grep -q -- '--load-target' "$README_HTML" \
            || { echo "::error::readme.html 缺少 --load-target 用法说明"; exit 1; }

      # 安装/清理脚本：构建时已 chmod 755，此处显式再确认一次
      # （注：artifact zip 解压后可能丢失 +x，文档统一引导用户 bash install.sh /
      #  bash clean.sh 调用）
      - name: Make install.sh / clean.sh executable
        run: |
          chmod +x "${{ steps.build.outputs.install_sh }}"
          chmod +x "${{ steps.build.outputs.clean_sh }}"

      # Artifacts 只能是 zip 封装：设 compression-level 0 让 zip 只做存储，
      # 避免 tgz 再被 zip 二次压缩。唯一产物
      # <image_prefix>_devcontainer_<架构>_<时间戳>（架构 amd64/arm64），
      # zip 内含镜像归档 tgz、src tgz、install.sh、readme.html、
      # devcontainer.json 与（css_framework_install=*_pack_in_artifact 模式下的）
      # <框架标签>-<version>.tgz（bootstrap-*.tgz / tailwindcss-browser-*.tgz）
      - name: Upload bundle artifact (docker images tgz + src tgz + install.sh + clean.sh + images.txt + readme.html + devcontainer.json + optional frontend framework tgz)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.bundle_name }}
          path: |
            ${{ steps.build.outputs.images_tgz }}
            ${{ steps.build.outputs.src_tgz }}
            ${{ steps.build.outputs.install_sh }}
            ${{ steps.build.outputs.clean_sh }}
            ${{ steps.build.outputs.images_txt }}
            ${{ steps.build.outputs.readme_html }}
            ${{ steps.build.outputs.devcontainer_json }}
            dist/bootstrap-*.tgz
            dist/tailwindcss-browser-*.tgz
          compression-level: 0
          if-no-files-found: error
